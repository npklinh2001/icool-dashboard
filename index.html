<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ICOOL RASA TACO Dashboard Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f6f4;
    --grid: #e4e3de;
    --surface: #ffffff;
    --surface-2: #f1f0ec;
    --ink: #1c1d21;
    --ink-2: #55575f;
    --ink-3: #8b8d95;
    --line: #e2e1dc;
    --link: #d6d5d0;
    --root-bg: #1c1d21;
    --root-ink: #ffffff;
    --shadow: 0 1px 2px rgba(20,20,30,.06), 0 4px 14px rgba(20,20,30,.06);
    --shadow-hi: 0 2px 4px rgba(20,20,30,.08), 0 10px 28px rgba(20,20,30,.12);
    --live: #1f9d63;
    --building: #d98a0b;
    --proposed: #3b5bdb;
    --noplan: #8b8d95;
    --hl-bg: #fff3bf;
    --hl-ink: #7a5b00;
    --warn: #e03131;
    --focus: #3b5bdb;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121317; --grid: #1f2126; --surface: #1b1d22; --surface-2: #24262c;
      --ink: #eceef2; --ink-2: #b0b3bc; --ink-3: #7c808b; --line: #2c2f36; --link: #353841;
      --root-bg: #eceef2; --root-ink: #121317;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
      --shadow-hi: 0 2px 4px rgba(0,0,0,.35), 0 10px 28px rgba(0,0,0,.4);
      --live: #3ccf8e; --building: #f0b03d; --proposed: #7b93ff; --noplan: #7c808b;
      --hl-bg: #3d3310; --hl-ink: #ffd968; --warn: #ff6b6b; --focus: #7b93ff;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121317; --grid: #1f2126; --surface: #1b1d22; --surface-2: #24262c;
    --ink: #eceef2; --ink-2: #b0b3bc; --ink-3: #7c808b; --line: #2c2f36; --link: #353841;
    --root-bg: #eceef2; --root-ink: #121317;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
    --shadow-hi: 0 2px 4px rgba(0,0,0,.35), 0 10px 28px rgba(0,0,0,.4);
    --live: #3ccf8e; --building: #f0b03d; --proposed: #7b93ff; --noplan: #7c808b;
    --hl-bg: #3d3310; --hl-ink: #ffd968; --warn: #ff6b6b; --focus: #7b93ff;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }

  /* ---------- Header ---------- */
  header {
    position: fixed; inset: 0 0 auto 0; z-index: 20;
    display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
    padding: 14px 24px;
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; flex-direction: column; min-width: 0; }
  .brand h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
  .brand p { margin: 2px 0 0; font-size: 12.5px; color: var(--ink-3); }
  .stats { display: flex; gap: 20px; margin-left: 8px; }
  .stat { display: flex; flex-direction: column; }
  .stat b { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 11.5px; color: var(--ink-3); }
  .stats { align-items: center; }
  .status-box {
    display: flex; flex-direction: column; gap: 6px; padding: 6px 12px 7px;
    border-left: 1px solid var(--line); margin-left: 2px;
  }
  .sbar { display: flex; height: 5px; border-radius: 3px; overflow: hidden; background: var(--surface-2); gap: 2px; }
  .sbar i { display: block; height: 100%; }
  .sitems { display: flex; gap: 14px; }
  .sitem { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--ink-3); white-space: nowrap; }
  .sitem b { font-size: 14px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
  .tools { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .search {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 9px;
    padding: 0 10px; height: 36px; width: 260px;
  }
  .search svg { flex: none; color: var(--ink-3); }
  .search input { border: 0; outline: 0; background: transparent; color: var(--ink); font: inherit; width: 100%; }
  .search:focus-within { border-color: var(--focus); }
  .btn {
    height: 36px; padding: 0 12px; border-radius: 9px;
    background: var(--surface); border: 1px solid var(--line);
    cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 500; white-space: nowrap;
  }
  .btn:hover { background: var(--surface-2); }
  .btn.icon { width: 36px; padding: 0; justify-content: center; }

  /* ---------- Canvas ---------- */
  #viewport {
    position: fixed; inset: 0; cursor: grab; touch-action: none;
    background-image: radial-gradient(var(--grid) 1.2px, transparent 1.2px);
    background-size: 22px 22px;
  }
  #viewport.panning { cursor: grabbing; }
  #stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #stage.animate { transition: transform .45s cubic-bezier(.2,.8,.2,1); }
  #links { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  #links path {
    fill: none; stroke-width: 4; stroke-linecap: round;
    transition: d .4s cubic-bezier(.2,.8,.2,1), opacity .3s, stroke .2s, stroke-width .2s;
  }
  #links path.hl { stroke-width: 5; }
  #links path.dim { opacity: .25; }

  /* ---------- Nodes ---------- */
  .node {
    position: absolute; left: 0; top: 0;
    display: flex; align-items: center; gap: 10px;
    border-radius: 12px; padding: 0 14px;
    background: var(--surface); border: 1px solid var(--line);
    box-shadow: var(--shadow);
    cursor: pointer; user-select: none;
    transition: transform .4s cubic-bezier(.2,.8,.2,1), opacity .3s, box-shadow .2s, border-color .2s;
  }
  .node:hover { box-shadow: var(--shadow-hi); border-color: color-mix(in srgb, var(--c) 55%, var(--line)); }
  .node.dim { opacity: .3; }
  .node.match, .node.active { border-color: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 28%, transparent), var(--shadow-hi); }
  .node .txt { min-width: 0; flex: 1; }
  .node .t { font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .node .s { font-size: 11.5px; color: var(--ink-3); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .node.root { background: var(--root-bg); color: var(--root-ink); border-color: transparent; }
  .node.root .t { font-size: 15.5px; font-weight: 700; }
  .node.root .s { color: color-mix(in srgb, var(--root-ink) 60%, transparent); }
  .node.root .mark {
    width: 34px; height: 34px; border-radius: 9px; flex: none;
    display: grid; place-items: center;
    background: color-mix(in srgb, var(--root-ink) 14%, transparent);
  }

  .node.khoi {
    background: color-mix(in srgb, var(--c) 9%, var(--surface));
    border-color: color-mix(in srgb, var(--c) 30%, var(--line));
  }
  .node.khoi .t { font-size: 14.5px; }
  .node.khoi .ico {
    width: 32px; height: 32px; border-radius: 8px; flex: none;
    display: grid; place-items: center; color: #fff; background: var(--c);
  }
  .node.khoi.noplan { border-style: dashed; }
  .node.khoi.noplan .ico { background: color-mix(in srgb, var(--c) 55%, var(--ink-3)); }

  .node.group { background: color-mix(in srgb, var(--c) 5%, var(--surface)); }
  .node.group .gdot { width: 10px; height: 10px; border-radius: 3px; background: var(--c); flex: none; }

  .count {
    flex: none; min-width: 24px; height: 22px; padding: 0 7px; border-radius: 11px;
    display: grid; place-items: center; font-size: 11.5px; font-weight: 700;
    background: var(--surface); color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 30%, var(--line));
  }
  .node .chev { flex: none; color: var(--ink-3); transition: transform .3s; }
  .node.collapsed .chev { transform: rotate(-90deg); }

  .node.leaf { padding-left: 16px; }
  .node.leaf::before {
    content: ""; position: absolute; left: -1px; top: 10px; bottom: 10px; width: 3px;
    border-radius: 0 3px 3px 0; background: var(--c);
  }
  .node.leaf .t { font-size: 13.5px; }
  .node.leaf.noplan { border-style: dashed; }
  .node.leaf.noplan::before { opacity: .45; }

  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
  .dot.live { background: var(--live); box-shadow: 0 0 0 3px color-mix(in srgb, var(--live) 22%, transparent); }
  .dot.building { background: var(--building); box-shadow: 0 0 0 3px color-mix(in srgb, var(--building) 22%, transparent); }
  .dot.proposed { background: var(--proposed); box-shadow: 0 0 0 3px color-mix(in srgb, var(--proposed) 20%, transparent); }
  .dot.noplan { background: transparent; border: 1.5px dashed var(--noplan); }

  /* ---------- Floating UI ---------- */
  .legend {
    position: fixed; left: 24px; bottom: 20px; z-index: 10;
    display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 14px; box-shadow: var(--shadow); font-size: 12px; color: var(--ink-2);
  }
  .legend span { display: inline-flex; align-items: center; gap: 7px; }
  .zoom {
    position: fixed; right: 24px; bottom: 20px; z-index: 10;
    display: flex; background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; box-shadow: var(--shadow); overflow: hidden;
  }
  .zoom button { width: 38px; height: 36px; border: 0; background: transparent; cursor: pointer; display: grid; place-items: center; }
  .zoom button + button { border-left: 1px solid var(--line); }
  .zoom button:hover { background: var(--surface-2); }
  .zoom .pct { width: 56px; font-size: 12px; font-variant-numeric: tabular-nums; color: var(--ink-2); }
  .hint { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 9; font-size: 12px; color: var(--ink-3); pointer-events: none; white-space: nowrap; }

  /* ---------- Detail panel ---------- */
  #panel {
    position: fixed; top: 76px; right: 16px; bottom: 16px; width: 400px; z-index: 30;
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    box-shadow: var(--shadow-hi); padding: 22px; overflow-y: auto;
    transform: translateX(calc(100% + 30px)); transition: transform .35s cubic-bezier(.2,.8,.2,1);
  }
  #panel.open { transform: none; }
  #panel .close { position: absolute; top: 14px; right: 14px; }
  #panel .crumb { font-size: 12px; font-weight: 600; color: var(--c); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-right: 44px; }
  #panel .crumb .sep { color: var(--ink-3); font-weight: 400; }
  #panel h2 { margin: 10px 40px 4px 0; font-size: 20px; line-height: 1.3; letter-spacing: -.01em; }
  #panel .report { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 14px; }
  .pill {
    display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600;
    padding: 4px 10px 4px 9px; border-radius: 99px; background: var(--surface-2);
  }
  #panel h3 {
    font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3);
    margin: 24px 0 10px; display: flex; align-items: center; gap: 8px;
  }
  #panel h3 .n { color: var(--c); }
  .info {
    margin: 0; padding: 12px 14px; border-radius: 10px; line-height: 1.6; white-space: pre-line;
    background: color-mix(in srgb, var(--c) 7%, var(--surface)); border: 1px solid color-mix(in srgb, var(--c) 18%, var(--line));
  }
  ol.kpis { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  ol.kpis li {
    display: grid; grid-template-columns: 24px 1fr; gap: 10px; align-items: start;
    padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); line-height: 1.5;
  }
  ol.kpis .i {
    width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center;
    font-size: 11px; font-weight: 700; color: var(--c); background: color-mix(in srgb, var(--c) 12%, var(--surface));
  }
  ol.kpis li.hl { background: var(--hl-bg); border-color: color-mix(in srgb, var(--hl-ink) 30%, transparent); }
  ol.kpis li.hl .tag { color: var(--hl-ink); }
  ol.kpis li.warn .kt { color: var(--warn); font-weight: 600; }
  ol.kpis li.warn .tag { color: var(--warn); }
  ol.kpis .tag { display: block; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 2px; }
  ol.kpis .kn { display: block; font-size: 12.5px; color: var(--ink-2); margin-top: 3px; }
  .note {
    margin-top: 16px; font-size: 12.5px; color: var(--ink-2); padding: 10px 12px;
    border-radius: 10px; border: 1px dashed var(--line);
  }
  dl.meta { display: grid; grid-template-columns: 120px 1fr; gap: 10px 12px; margin: 0; font-size: 13px; }
  dl.meta dt { color: var(--ink-3); }
  dl.meta dd { margin: 0; font-weight: 500; }
  /* Link dashboard trong panel */
  .open-link {
    margin-top: 18px; display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; border-radius: 12px; text-decoration: none; color: var(--ink);
    background: linear-gradient(135deg, color-mix(in srgb, #f2c811 16%, var(--surface)), var(--surface));
    border: 1px solid color-mix(in srgb, #f2c811 45%, var(--line));
    transition: transform .15s, box-shadow .2s, border-color .2s;
  }
  .open-link:hover { transform: translateY(-1px); box-shadow: var(--shadow-hi); border-color: #f2c811; }
  .open-link .pbi {
    width: 40px; height: 40px; border-radius: 10px; flex: none; display: grid; place-items: center;
    background: #1c1d21;
  }
  .open-link .ol-txt { flex: 1; min-width: 0; }
  .open-link .ol-t { display: block; font-weight: 700; font-size: 14px; }
  .open-link .ol-s { display: block; font-size: 12px; color: var(--ink-3); margin-top: 2px; }
  .open-link .ol-go {
    width: 32px; height: 32px; border-radius: 8px; flex: none; display: grid; place-items: center;
    background: var(--ink); color: var(--bg); transition: transform .15s;
  }
  .open-link:hover .ol-go { transform: translate(2px, -2px); }

  /* Nút mở nhanh trên node báo cáo */
  .node .quick {
    flex: none; height: 26px; padding: 0 8px 0 6px; border-radius: 7px; display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 700; text-decoration: none; color: #fff;
    background: #1c1d21; box-shadow: inset 0 0 0 1px rgba(242,200,17,.5); transition: transform .15s, filter .15s;
  }
  .node .quick:hover { transform: scale(1.06); filter: brightness(1.05); }

  @media (max-width: 1440px) { .search { width: 200px; } .tools .btn .lbl { display: none; } .tools .btn { width: 36px; padding: 0; justify-content: center; } }
  @media (max-width: 1100px) { .hint { display: none; } .status-box { display: none; } }
  @media (max-width: 860px) {
    header { padding: 12px 16px; gap: 12px; }
    .stats { display: none; }
    .tools { margin-left: 0; width: 100%; }
    .search { flex: 1; width: auto; }
    .btn .lbl { display: none; }
    .btn { width: 36px; padding: 0; justify-content: center; }
    .legend { left: 16px; bottom: 70px; right: 16px; }
    .zoom { right: 16px; bottom: 16px; }
    #panel { top: auto; left: 0; right: 0; bottom: 0; width: auto; max-height: 75vh; border-radius: 18px 18px 0 0; transform: translateY(105%); }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>ICOOL RASA TACO · Bản đồ Dashboard</h1>
    <p>Cấu trúc báo cáo &amp; KPI đề xuất theo Khối — Team Data</p>
  </div>
  <div class="stats">
    <div class="stat"><b id="st-khoi">0</b><span>Khối</span></div>
    <div class="stat"><b id="st-report">0</b><span>Báo cáo</span></div>
    <div class="status-box">
      <div class="sbar" id="st-bar"></div>
      <div class="sitems" id="st-status"></div>
    </div>
  </div>
  <div class="tools">
    <label class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Tìm khối, báo cáo, KPI…" autocomplete="off">
    </label>
    <button class="btn" id="expand" title="Mở tất cả">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      <span class="lbl">Mở tất cả</span>
    </button>
    <button class="btn" id="collapse" title="Thu gọn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
      <span class="lbl">Thu gọn</span>
    </button>
    <button class="btn icon" id="theme" title="Đổi giao diện sáng/tối">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>

<div id="viewport">
  <div id="stage">
    <svg id="links"></svg>
    <div id="nodes"></div>
  </div>
</div>

<div class="legend" id="legend"></div>
<div class="hint">Kéo để di chuyển · Cuộn để phóng to · Bấm Khối để mở/thu gọn · Bấm báo cáo để xem KPI</div>

<div class="zoom">
  <button id="zout" title="Thu nhỏ"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
  <button class="pct" id="zpct" title="Về 100%">100%</button>
  <button id="zin" title="Phóng to"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button id="fit" title="Vừa màn hình"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</div>

<aside id="panel" aria-live="polite"></aside>

<script>
/* =====================================================================
   DỮ LIỆU — chỉnh sửa tại đây
   ---------------------------------------------------------------------
   Khối:     { name, color, icon, status?, children: [...] }
   Bộ phận:  { name, children: [...] }            (nhóm có con, vd. Marketing, Sale)
   Báo cáo:  { name, author, viewers?, contact, report, info, kpis: [...], status?, note?, owner?, tool?, refresh?, url? }
   viewers:  người xem báo cáo — "Tên" hoặc ["Tên 1", "Tên 2"]
   KPI:      "chuỗi"  hoặc  { t: "tên KPI", hl: true (trọng tâm) | warn: true (nhấn mạnh), note: "ghi chú" }
   status:   'live' | 'building' | 'proposed' (mặc định) | 'noplan'
             → đặt ở Khối thì áp dụng cho mọi báo cáo bên trong.
   ===================================================================== */
const DATA = {
  name: "ICOOL RASA TACO",
  sub: "Hệ thống báo cáo",
  children: [
    {
      name: "KHỐI KINH DOANH", color: "#1971c2", icon: "chart",
      children: [
        { name: "Hoạt động kinh doanh", children: [
          { name: "Doanh thu", author: "Nguyễn Phan Khánh Linh", viewers: ["Ban Giám đốc", "Giám đốc vùng", "Quản lí chi nhánh", "P.MKT (Sale)"], contact: "0969320414", report: "Báo cáo Hoạt động kinh doanh",
            status: "live", tool: "Power BI",
            url: "https://app.powerbi.com/Redirect?action=OpenApp&appId=ce0c300e-52a3-4089-a751-94cf3627ad6a&ctid=b9f86305-291b-4050-9c47-58ac594b81f3&experience=power-bi",
            info: "Doanh thu thực đạt, KPI và dự đoán, cùng kì năm trước (ICOOL) / tháng trước (RASA và TACO); Số bill; TBB; Tua; Số phòng\n→ Phân tích theo Tháng, Ngày, Chi nhánh, Khung giờ, Xu hướng",

    `<i style="flex:${cnt(k)};background:${COLORS[k]}${k === "noplan" ? ";opacity:.45" : ""}" title="${STATUS[k]}: ${cnt(k)}"></i>`).join("");
}
const used = new Set(leaves.map(l => l.status));
$("#legend").innerHTML = Object.entries(STATUS).filter(([k]) => used.has(k) || k === "live" || k === "building")
  .map(([k, v]) => `<span><i class="dot ${k}"></i>${v}</span>`).join("");

// Mặc định: chỉ mở Khối đầu tiên
khois.forEach((k, i) => (k.collapsed = i !== 0));

/* ---------- Layout ---------- */
const COL_W = [250, 340, 320, 320, 320], COL_GAP = 110, ROW_GAP = 14, KHOI_GAP = 26, PAD = 60;
const nodeH = n => (n.depth === 0 ? 76 : n.depth === 1 ? 64 : isBranch(n) ? 54 : 60);
const colW = d => COL_W[Math.min(d, COL_W.length - 1)];
const colX = d => { let x = PAD; for (let i = 0; i < d; i++) x += colW(i) + COL_GAP; return x; };
const visibleKids = n => (n.collapsed ? [] : n.children || []);

function layout() {
  let cursor = PAD, maxDepth = 0; const list = [];
  (function walk(n) {
    n.w = colW(n.depth); n.h = nodeH(n); n.x = colX(n.depth);
    maxDepth = Math.max(maxDepth, n.depth);
    const kids = visibleKids(n);
    if (!kids.length) { n.y = cursor; cursor += n.h + ROW_GAP; }
    else {
      kids.forEach((c, i) => { if (n.depth === 0 && i > 0) cursor += KHOI_GAP; walk(c); });
      const a = kids[0], b = kids[kids.length - 1];
      n.y = (a.y + a.h / 2 + b.y + b.h / 2) / 2 - n.h / 2;
    }
    list.push(n);
  })(DATA);
  const top = Math.min(...list.map(n => n.y));
  if (top < PAD) list.forEach(n => (n.y += PAD - top));
  return { list, width: colX(maxDepth) + colW(maxDepth) + PAD, height: Math.max(...list.map(n => n.y + n.h)) + PAD };
}

/* ---------- Render ---------- */
const nodesEl = $("#nodes"), linksEl = $("#links");
const els = new Map(), paths = new Map();
let bounds = { width: 0, height: 0 }, visible = new Set();
let activeId = null, query = "";

function nodeHTML(n) {
  if (n.depth === 0)
    return `<div class="mark">${svgIcon("grid", 18)}</div><div class="txt"><div class="t">${n.name}</div><div class="s">${n.sub}</div></div>`;
  const cnt = leavesOf(n).length;
  if (n.depth === 1) {
    const sub = n.status === "noplan" ? "Chưa có kế hoạch" : `${n.children.length} bộ phận · ${leavesOf(n).reduce((a, l) => a + (l.kpis || []).length, 0)} KPI`;
    return `<div class="ico">${svgIcon(n.icon)}</div><div class="txt"><div class="t">${n.name}</div><div class="s">${sub}</div></div><div class="count" title="${cnt} báo cáo">${cnt}</div>${CHEV}`;
  }
  if (isBranch(n))
    return `<i class="gdot"></i><div class="txt"><div class="t">${n.name}</div></div><div class="count" title="${cnt} báo cáo">${cnt}</div>${CHEV}`;
  const sub = [n.report, `${(n.kpis || []).length} KPI`].filter(Boolean).join(" · ");
  const quick = n.url ? `<a class="quick" href="${n.url}" target="_blank" rel="noopener" title="Mở trên ${n.tool || "dashboard"}" onclick="event.stopPropagation()">${PBI(13)}Mở</a>` : "";
  return `<div class="txt"><div class="t" title="${n.name}">${n.name}</div><div class="s" title="${sub}">${sub}</div></div>${quick}<i class="dot ${n.status}" title="${STATUS[n.status]}"></i>`;
}
const linkD = (p, c) => {
  const x1 = p.x + p.w, y1 = p.y + p.h / 2, x2 = c.x, y2 = c.y + c.h / 2, mx = (x1 + x2) / 2;
  return `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`;
};
const pos = n => `translate(${n.x}px, ${n.y}px)`;
const anchor = n => { let p = n.parent; while (p && !visible.has(p.id)) p = p.parent; return p || DATA; };
const tuck = (n, p) => `translate(${p.x + p.w - n.w}px, ${p.y + (p.h - n.h) / 2}px)`;
const pointD = p => { const x = p.x + p.w, y = p.y + p.h / 2; return `M${x},${y} C${x},${y} ${x},${y} ${x},${y}`; };

function render() {
  const { list, width, height } = layout();
  bounds = { width, height };
  visible = new Set(list.map(n => n.id));
  linksEl.setAttribute("width", width); linksEl.setAttribute("height", height);

  for (const n of list) {
    let el = els.get(n.id);
    if (!el) {
      el = document.createElement("div");
      const type = n.depth === 0 ? "root" : n.depth === 1 ? "khoi" : isBranch(n) ? "group" : "leaf";
      el.className = `node ${type} ${n.status || ""}`;
      el.style.setProperty("--c", n.c);
      el.style.width = n.w + "px"; el.style.height = n.h + "px";
      el.innerHTML = nodeHTML(n);
      el.addEventListener("click", e => { e.stopPropagation(); onNodeClick(n); });
      el.addEventListener("mouseenter", () => highlightPath(n, true));
      el.addEventListener("mouseleave", () => highlightPath(n, false));
      el.style.transform = n.parent ? tuck(n, n.parent) : pos(n);
      el.style.opacity = "0";
      nodesEl.appendChild(el); els.set(n.id, el);
      el.getBoundingClientRect();
    }
    el.style.transform = pos(n); el.style.opacity = "";
    el.classList.toggle("collapsed", !!n.collapsed);
  }
  for (const [id, el] of els) if (!visible.has(id)) {
    els.delete(id);
    const n = findById(id);
    el.style.transform = tuck(n, anchor(n)); el.style.opacity = "0";
    setTimeout(() => el.remove(), 400);
  }

  const want = new Set();
  for (const n of list) for (const c of visibleKids(n)) {
    want.add(c.id);
    let path = paths.get(c.id);
    const d = linkD(n, c);
    if (!path) {
      path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.dataset.base = `color-mix(in srgb, ${c.c} ${n.depth === 0 ? 35 : 22}%, var(--link))`;
      path.dataset.hl = `color-mix(in srgb, ${c.c} 80%, var(--link))`;
      path.style.stroke = path.dataset.base;
      path.setAttribute("d", pointD(n)); path.style.d = `path("${pointD(n)}")`;
      path.style.opacity = "0";
      linksEl.appendChild(path); paths.set(c.id, path);
      path.getBoundingClientRect();
    }
    path.setAttribute("d", d); path.style.d = `path("${d}")`; path.style.opacity = "";
  }
  for (const [id, path] of paths) if (!want.has(id)) {
    paths.delete(id);
    const d = pointD(anchor(findById(id)));
    path.style.d = `path("${d}")`; path.style.opacity = "0";
    setTimeout(() => path.remove(), 400);
  }
  applySearch();
}

function highlightPath(n, on) {
  const ids = [];
  if (isBranch(n) && !n.collapsed) n.children.forEach(c => ids.push(c.id));
  for (let cur = n; cur && cur.parent; cur = cur.parent) ids.push(cur.id);
  ids.forEach(id => {
    const p = paths.get(id); if (!p) return;
    p.classList.toggle("hl", on);
    p.style.stroke = on ? p.dataset.hl : p.dataset.base;
  });
}

/* ---------- Interaction ---------- */
function onNodeClick(n) {
  if (n.depth === 0) { const anyOpen = khois.some(g => !g.collapsed); khois.forEach(g => (g.collapsed = anyOpen)); render(); return; }
  if (isBranch(n)) { n.collapsed = !n.collapsed; render(); return; }
  openPanel(n);
}

function openPanel(n) {
  if (activeId) els.get(activeId)?.classList.remove("active");
  activeId = n.id; els.get(n.id)?.classList.add("active");
  const chain = []; for (let p = n.parent; p && p.depth > 0; p = p.parent) chain.unshift(p);
  const khoi = chain[0] || n;
  const kpis = (n.kpis || []).map(K);
  const viewers = [].concat(n.viewers || []).filter(Boolean).join(", ");
  const meta = [["Người làm báo cáo", n.author || "…"], ["Người xem báo cáo", viewers || "…"], ["Liên hệ (Zalo)", n.contact ? `<a href="https://zalo.me/${n.contact}" target="_blank" rel="noopener">${n.contact}</a>` : "…"], ["Phụ trách", n.owner], ["Cập nhật", n.refresh], ["Nguồn dữ liệu", n.source]].filter(x => x[1]);
  const panel = $("#panel");
  panel.style.setProperty("--c", n.c);
  panel.innerHTML = `
    <button class="btn icon close" title="Đóng" onclick="closePanel()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <div class="crumb">${svgIcon(khoi.icon, 14)} ${chain.map(c => c.name).join(' <span class="sep">›</span> ')}</div>
    <h2>${n.name}</h2>
    ${n.report ? `<div class="report">${n.report}</div>` : `<div style="height:10px"></div>`}
    <span class="pill"><i class="dot ${n.status}"></i>${STATUS[n.status]}</span>
    ${n.url ? `<a class="open-link" href="${n.url}" target="_blank" rel="noopener">
      <span class="pbi">${PBI(22)}</span>
      <span class="ol-txt"><span class="ol-t">Mở báo cáo trên ${n.tool || "dashboard"}</span><span class="ol-s">${new URL(n.url).hostname}</span></span>
      <span class="ol-go"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg></span>
    </a>` : ""}
    ${n.info ? `<h3>Thông tin trong báo cáo</h3><p class="info">${n.info}</p>` : ""}
    ${kpis.length ? `<h3>KPI đề xuất <span class="n">${kpis.length}</span></h3><ol class="kpis">${kpis.map((k, i) => `
      <li class="${k.hl ? "hl" : ""} ${k.warn ? "warn" : ""}">
        <span class="i">${i + 1}</span>
        <span>${k.hl ? '<span class="tag">Trọng tâm</span>' : k.warn ? '<span class="tag">Lưu ý</span>' : ""}<span class="kt">${k.t}</span>${k.note ? `<span class="kn">${k.note}</span>` : ""}</span>
      </li>`).join("")}</ol>` : ""}
    ${n.note ? `<div class="note">${n.note}</div>` : ""}
    ${meta.length ? `<h3>Thông tin dashboard</h3><dl class="meta">${meta.map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join("")}</dl>` : ""}
  `;
  panel.scrollTop = 0;
  panel.classList.add("open");
}
function closePanel() {
  $("#panel").classList.remove("open");
  if (activeId) els.get(activeId)?.classList.remove("active");
  activeId = null;
}
document.addEventListener("keydown", e => { if (e.key === "Escape") closePanel(); });

/* ---------- Search ---------- */
const norm = s => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/gi, "d").toLowerCase();
const hay = n => {
  const anc = []; for (let p = n.parent; p; p = p.parent) anc.push(p.name);
  return norm([n.name, n.author, ...[].concat(n.viewers || []), n.report, n.info, n.note, n.owner, n.tool, ...(n.kpis || []).map(K).flatMap(k => [k.t, k.note]), ...anc].join(" "));
};
function matches(q) {
  const hits = new Set();
  if (!q) return hits;
  leaves.forEach(l => { if (hay(l).includes(q)) for (let p = l; p; p = p.parent) hits.add(p.id); });
  return hits;
}
function applySearch() {
  const q = norm(query.trim()), hits = matches(q);
  for (const [id, el] of els) {
    const n = findById(id);
    el.classList.toggle("match", !!q && !isBranch(n) && hits.has(id));
    el.classList.toggle("dim", !!q && n.depth > 0 && !hits.has(id));
  }
  for (const [id, p] of paths) p.classList.toggle("dim", !!q && !hits.has(id));
}
$("#q").addEventListener("input", e => {
  query = e.target.value;
  const hits = matches(norm(query.trim()));
  let changed = false;
  index.forEach(n => { if (isBranch(n) && n.collapsed && hits.has(n.id)) { n.collapsed = false; changed = true; } });
  if (changed) render(); else applySearch();
});

$("#expand").onclick = () => { index.forEach(n => { if (isBranch(n)) n.collapsed = false; }); render(); setTimeout(() => fit(true), 50); };
$("#collapse").onclick = () => { khois.forEach(g => (g.collapsed = true)); render(); setTimeout(() => fit(true), 50); };

/* ---------- Pan & zoom ---------- */
const vp = $("#viewport"), stage = $("#stage");
const view = { x: 0, y: 0, k: 1 };
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
function apply(animate) {
  stage.classList.toggle("animate", !!animate);
  stage.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.k})`;
  $("#zpct").textContent = Math.round(view.k * 100) + "%";
}
function zoomAt(px, py, f, animate) {
  const k = clamp(view.k * f, 0.2, 2.5), r = k / view.k;
  view.x = px - (px - view.x) * r; view.y = py - (py - view.y) * r; view.k = k;
  apply(animate);
}
function fit(animate) {
  const top = document.querySelector("header").offsetHeight;
  const W = innerWidth, H = innerHeight - top - 60;
  const k = clamp(Math.min(W / bounds.width, H / bounds.height), 0.35, 1.05);
  view.k = k; view.x = Math.max((W - bounds.width * k) / 2, 0); view.y = top + Math.max(0, (H - bounds.height * k) / 2);
  apply(animate);
}
const center = () => [innerWidth / 2, innerHeight / 2];
$("#zin").onclick = () => zoomAt(...center(), 1.2, true);
$("#zout").onclick = () => zoomAt(...center(), 1 / 1.2, true);
$("#zpct").onclick = () => zoomAt(...center(), 1 / view.k, true);
$("#fit").onclick = () => fit(true);

vp.addEventListener("wheel", e => {
  e.preventDefault();
  if (e.ctrlKey || (Math.abs(e.deltaY) > Math.abs(e.deltaX) && !e.shiftKey)) zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0015));
  else { view.x -= e.deltaX || e.deltaY; apply(); }
}, { passive: false });

const pointers = new Map(); let pinch = null, moved = false;
vp.addEventListener("pointerdown", e => {
  if (e.target.closest(".node")) return;
  vp.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  moved = false; vp.classList.add("panning");
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) }; }
});
vp.addEventListener("pointermove", e => {
  const p = pointers.get(e.pointerId); if (!p) return;
  if (pointers.size === 2 && pinch) {
    p.x = e.clientX; p.y = e.clientY;
    const [a, b] = [...pointers.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
    zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, d / pinch.d); pinch.d = d; moved = true; return;
  }
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  if (Math.abs(dx) + Math.abs(dy) > 2) moved = true;
  view.x += dx; view.y += dy; p.x = e.clientX; p.y = e.clientY; apply();
});
const endPtr = e => { pointers.delete(e.pointerId); if (pointers.size < 2) pinch = null; if (!pointers.size) vp.classList.remove("panning"); };
vp.addEventListener("pointerup", e => { if (!moved && !e.target.closest(".node")) closePanel(); endPtr(e); });
vp.addEventListener("pointercancel", endPtr);

/* ---------- Theme ---------- */
$("#theme").onclick = () => {
  const root = document.documentElement;
  const cur = root.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  root.dataset.theme = cur === "dark" ? "light" : "dark";
  try { localStorage.setItem("icool-theme", root.dataset.theme); } catch (_) {}
};
try { const t = localStorage.getItem("icool-theme"); if (t) document.documentElement.dataset.theme = t; } catch (_) {}

/* ---------- Init ---------- */
render();
fit(false);
addEventListener("resize", () => fit(false));
</script>
</body>
</html>
